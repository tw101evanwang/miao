<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todolist-vue</title>
</head>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
  }

  h1 {
    font-size: 80px;
    color: #b83f45;
    font-weight: 200;
  }

  .newtodo {
    height: 65px;
    width: 600px;
    font-size: 24px;
    background-color: #ca7373;
  }

  main {
    position: relative;
  }

  .allinput {
    position: absolute;
    bottom: 100%;
    width: 40px;
    height: 60px;
  }
</style>

<body>
  <aside></aside>
  <section>
    <header>
      <a href="https://www.google.com">
        <h1>todos</h1>
      </a>
      <input type="text" class="newtodo" value="">
    </header>
    <main class="main">
      <div>
        <input type="checkbox" class="allinput">
      </div>
      <ul class="todolist"></ul>
    </main>
    <footer>
      <span></span>
      <ul></ul>
    </footer>
  </section>
  <footer></footer>
  <script>
    let allinput = document.querySelector('.allinput')
    let newtodo = document.querySelector('.newtodo')
    let todolist = document.querySelector('.todolist')
    let todos = []
    let savedTodos = localStorage.getItem('todos')
    if (savedTodos) {
      todos = JSON.parse(savedTodos)
      updateAllInput()
      render()
    }
    newtodo.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        let val = newtodo.value.trim()
        if (val) {
          todos.push({ text: val, completed: false })
          saveTodos()
          newtodo.value = ''
        } else {
          return
        }
        render()
      }
    })
    function render() {
      todolist.innerHTML = ''
      todos.forEach((it, index) => {
        let li = document.createElement('li')
        let checkbox = document.createElement('input')
        let button = document.createElement('button')
        checkbox.type = 'checkbox'
        checkbox.checked = it.completed
        checkbox.addEventListener('change', function () {
          it.completed = checkbox.checked
          saveTodos()
          updateAllInput()
          updateTodoStyle(li, it.completed)
        })
        updateTodoStyle(li, it.completed)
        button.textContent = '删除'
        button.addEventListener('click', function () {
          todos.splice(index, 1)
          saveTodos()
          updateAllInput()
          render()
        })
        li.append(checkbox, it.text, button)
        todolist.append(li)
      })
    }
    function updateTodoStyle(li, completed) {
      if (completed) {
        li.style.textDecoration = 'line-through'
      } else {
        li.style.textDecoration = 'none'
      }
    }
    allinput.addEventListener('change', function () {
      todos.forEach((it) => {
        it.completed = allinput.checked
      })
      saveTodos()
      render()
    })
    function updateAllInput() {
      if (todos.length === 0) {
        allinput.checked = false
      } else {
        allinput.checked = todos.every((it) => {
          return it.completed
        })
      }
    }
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos))
    }
  </script>
</body>

</html>
