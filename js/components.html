<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>component</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      template: /*html*/`
        <div><counter :step="3" :start="6"></counter></div>
        <div><counter :step="4"></counter></div>
        <div><counter :start="5"></counter></div>
        <div><counter></counter></div>
        <radios></radios>
      `,
      data() {
        return {

        }
      },
      methods: {

      },
      computed: {

      }
    })
    app.component('counter', {
      props: {
        step: {
          type: Number,
          default: 2,
        },
        start: {
          type: Number,
          default: 2,
        },
      },
      template: `
        <div class="inline-flex items-center gap-2 my-1">
          <button @click="dec" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded cursor-pointer"> -{{ step }}</button >
          <span class="px-4 py-1 border border-gray-400 rounded-md font-mono font-semibold text-gray-800 bg-gray-50 min-w-[3rem] text-center">
            {{ count }}
          </span>
          <button @click = "inc" class= "px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded cursor-pointer"> +{{ step }}</button>
        </div>
      `,
      data() {
        return {
          count: this.start ?? 1
        }
      },
      methods: {
        inc() {
          this.count += this.step
        },
        dec() {
          this.count -= this.step
        },
      },
    })
    app.component('radios', {
      props: {

      },
      template: `

      `,
      data() {
        return {
          count: this.start ?? 1
        }
      },
      methods: {

      },
    })
    app.mount('#app')
  </script>
</body>

</html>
