<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>component</title>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      template: /*html*/`
        <counter></counter>
        <counter></counter>
        <counter></counter>
        <counter></counter>
      `,
      data() {
        return {

        }
      },
      methods: {

      },
      computed: {

      }
    })
    app.component('counter', {
      template: `
        <button @click="count++">{{ count }}</button>
      `,
      data() {
        return {
          count: 1
        }
      },
    })
    app.mount('#app')
  </script>
</body>

</html>
