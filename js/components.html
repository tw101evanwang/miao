<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>component</title>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      template: /*html*/`
        <div><counter :step="3" :start="6"></counter></div>
        <div><counter :step="4"></counter></div>
        <div><counter :start="5"></counter></div>
        <div><counter></counter></div>
      `,
      data() {
        return {

        }
      },
      methods: {

      },
      computed: {

      }
    })
    app.component('counter', {
      props: {
        step: {
          type: Number,
          default: 2,
        },
        start: {
          type: Number,
          default: 2,
        },
      },
      template: `
        <button @click="inc">+{{ step }}</button>
        {{ count }}
        <button @click="dec">-{{ step }}</button>
      `,
      data() {
        return {
          count: this.start ?? 1
        }
      },
      methods: {
        inc() {
          this.count += this.step
        },
        dec() {
          this.count -= this.step
        },
      },
    })
    app.component('radio', {

    })
    app.mount('#app')
  </script>
</body>

</html>
