<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>component</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      template: /*html*/`
        <div><counter :step="3" :start="6"></counter></div>
        <div><counter :step="4"></counter></div>
        <div><counter :start="5"></counter></div>
        <div><counter></counter></div>
        <radios ></radios>
      `,
      data() {
        return {

        }
      },
      methods: {

      },
      computed: {

      }
    })
    app.component('counter', {
      props: {
        step: {
          type: Number,
          default: 2,
        },
        start: {
          type: Number,
          default: 2,
        },
      },
      template: `
        <div class="inline-flex items-center gap-2 my-1">
          <button @click="dec" class="px-3 py-1 border hover:bg-sky-200"> -{{ step }}</button >
          <span class="w-12 py-1 border text-center hover:bg-sky-200">
            {{ count }}
          </span>
          <button @click="inc" class="px-3 py-1 border hover:bg-sky-200"> +{{ step }}</button>
        </div>
      `,
      data() {
        return {
          count: this.start ?? 1
        }
      },
      methods: {
        inc() {
          this.count += this.step
        },
        dec() {
          this.count -= this.step
        },
      },
    })
    app.component('radios', {
      props: {

      },
      template: `
        <div>
          <button>prev</button>
          <a href="">
            <img src="" alt="">
          </a>
          <button>next</button>
        </div>      
      `,
      data() {
        return {

        }
      },
      methods: {

      },
    })
    app.mount('#app')
  </script>
</body>

</html>
