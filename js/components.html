<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>component</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      template: /*html*/`
      <div>
        <div><counter :step="3" :start="6"></counter></div>
        <div><counter :step="4"></counter></div>
        <div><counter :start="5"></counter></div>
        <div><counter></counter></div>
        <radios :slides="images" autoplay :interval="500"></radios>
      </div>
      `,
      data() {
        return {
          images: [
            {
              imagelink: "https://www.mi.com/shop/buy?product_id=25802",
              imageURL: "https://cdn.cnbj1.fds.api.mi-img.com/mi-mall/7308edc0b936bc042f55cbd9fd6e401e.png?thumb=1&w=1226&h=460&f=webp&q=90",
            },
            {
              imagelink: "https://www.mi.com/a/h/96392.html?sign=e4885cfdddf490c17c0144daefa9a787",
              imageURL: "https://cdn.cnbj1.fds.api.mi-img.com/mi-mall/065dcd3751ebe59fbeb7566d5efc6dd3.jpg?thumb=1&w=1226&h=460&f=webp&q=90",
            },
          ],
        }
      },
      methods: {

      },
      computed: {

      }
    })
    app.component('counter', {
      props: {
        step: {
          type: Number,
          default: 2,
        },
        start: {
          type: Number,
          default: 2,
        },
      },
      template: `
        <div class="inline-flex items-center gap-2 my-1">
          <button @click="dec" class="px-3 py-1 border hover:bg-sky-200"> -{{ step }}</button >
          <span class="w-12 py-1 border text-center hover:bg-sky-200">
            {{ count }}
          </span>
          <button @click="inc" class="px-3 py-1 border hover:bg-sky-200"> +{{ step }}</button>
        </div>
      `,
      data() {
        return {
          count: this.start ?? 1
        }
      },
      methods: {
        inc() {
          this.count += this.step
        },
        dec() {
          this.count -= this.step
        },
      },
    })
    app.component('radios', {
      props: {
        slides: {
          type: Array,
          required: true,
        },
        autoplay: {
          type: Boolean,
          default: false,
        },
        interval: {
          type: Number,
          default: 2000,
        },
      },
      template: `
        <div class="border w-[600px] h-[200px] relative">
          <button @click="prev" class="absolute top-1/2 -translate-y-1/2 left-2 bg-white/80">prev</button>
          <a :href="slides[i].imagelink" class="block w-full h-full">
            <img :src="slides[i].imageURL" alt="" class="block w-full h-full">
          </a>
          <button @click="next" class="absolute top-1/2 -translate-y-1/2 right-2 bg-white/80">next</button>
        </div>      
      `,
      data() {
        return {
          i: 0,
          timer: null,
        }
      },
      methods: {
        prev() {
          this.i--
          if (this.i === -1) {
            this.i = this.slides.length - 1
          }
        },
        next() {
          this.i++
          if (this.i === this.slides.length) {
            this.i = 0
          }
        },

      },
      mounted() {
        if (this.autoplay) {
          this.timer = setInterval(() => {
            this.next()
          }
            , this.interval)
        }
      },
      beforeUnmount() {
        if (this.timer) {
          clearInterval(this.timer)
          this.timer = null
        }
      }
    })
    app.mount('#app')
  </script>
</body>

</html>
