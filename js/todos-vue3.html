<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todos-vue3</title>
</head>
<body>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <div id="app">{{ message }}</div>
  <script>
    let { createApp } = Vue
    createApp({
      data() {
        return {
          message: '0123456789'
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
