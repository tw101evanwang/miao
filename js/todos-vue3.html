<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todos-vue3</title>
  <style>
    .todolist {
      list-style: none;
      padding-left: 0;
    }

    button {
      border: none;
    }
  </style>
</head>

<body>
  <div id="app">
    <a :href="url">
      <h1>{{ message }}</h1>
    </a>
    <input type="checkbox" class="alltoggle"></input>
    <input type="text" v-model="input" placeholder="What needs to be done?" @keydown.enter='addtodo()'>
    <ul class="todolist">
      <!-- 数组在JavaScript中也是一种特殊的对象,数组的元素可以通过索引访问,数组的索引用作了key -->
      <li v-for="(item, index) in todos" :key="index">
        <input type="checkbox" class="toggle" v-model="item.completed"></input>
        <label for="">{{ item.title }}</label>
        <span>{{ item.completed }}</span>
        <button @click="deleteTodo(index)">&times;</button>
      </li>
    </ul>
    <footer>
      <span class="todocount">item left</span>
      <label>
        <input type="radio" value="all">All
      </label>
      <label>
        <input type="radio" value="active">Active
      </label>
      <label>
        <input type="radio" value="completed">Completed
      </label>
      <button class="clearcompleted">Clear completed</button>
    </footer>
  </div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      data() {
        return {
          url: 'https://ip.sb/',
          message: 'todos',
          input: '',
          todos: [],
        }
      },
      methods: {
        addtodo() {
          //空字符串''在条件判断中会被当成false,所以要取反
          if (!this.input.trim()) return
          //this.todos.push(this.input)这个push的带有空格，是原始字符串
          let todo = {
            title: this.input.trim(),
            completed: false,
          }
          this.todos.push(todo)
          this.input = ''
          console.log(this.todos)
        },
        deleteTodo(index) {
          //this.todos = this.todos.filter((item, i) => i !== index)
          this.todos.splice(index, 1)
        }
      },
      computed: {

      }
    })
    app.mount('#app')
  </script>
</body>

</html>
